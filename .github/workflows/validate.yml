name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Validate, lint, test and build
    runs-on: ubuntu-latest
    env:
      # Shared by the packages/database tests; the API test setup overrides it.
      DATABASE_URL: postgres://devforge:devforge@localhost:5432/devforge_test
      # Used by the auth integration tests (defaults to localhost:5433 locally).
      AUTH_TEST_DATABASE_URL: postgres://devforge:devforge@localhost:5432/devforge_test
      # Used by the AI service pgvector integration tests (skipped when unset).
      AI_TEST_DATABASE_URL: postgres://devforge:devforge@localhost:5432/devforge_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devforge
          POSTGRES_PASSWORD: devforge
          POSTGRES_DB: devforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devforge -d devforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Install AI service dependencies
        run: python -m pip install -e "./apps/ai[dev]"

      - name: Validate repository structure and secrets
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Lint AI service
        run: ruff check apps/ai

      - name: Test
        run: npm test

      - name: Test AI service
        run: pytest apps/ai

      - name: Build
        run: npm run build

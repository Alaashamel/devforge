name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate structure, config and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate repository
        run: npm run validate

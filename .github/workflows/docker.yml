name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t devforge-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t devforge-web:ci .

      - name: Build AI image
        run: docker build -f apps/ai/Dockerfile -t devforge-ai:ci .

      - name: Build nginx image
        run: docker build infrastructure/nginx -t devforge-nginx:ci
